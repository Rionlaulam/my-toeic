<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132b36">
  <meta name="description" content="Five original TOEIC-format Listening and Reading practice tests with Unsplash workplace photographs, silent answer capture, timed exams, and comprehensive post-submit review.">
  <title>Clearline — TOEIC Practice Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="#home" id="home-link" aria-label="Clearline home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>clearline</strong><small>TOEIC practice studio</small></span>
      </a>
      <div class="topbar-right">
        <span class="offline-tag"><span class="status-dot"></span> Local test data</span>
        <button class="text-button" id="history-link" type="button">Your history</button>
      </div>
    </header>

    <main id="app-root" tabindex="-1" aria-live="polite">
      <section class="loading-state" aria-label="Loading application">
        <div class="loader"></div>
        <p>Preparing your practice studio…</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Clearline is an independent practice project and is not affiliated with or endorsed by ETS.</span>
      <span>Questions are original. Photos are linked from Unsplash; listening playback uses your browser’s speech engine.</span>
    </footer>
  </div>
  <noscript><p class="noscript">This practice app needs JavaScript enabled to load its test files.</p></noscript>
</body>
</html>
